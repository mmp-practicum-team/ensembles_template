name: Самопроверка решения

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test-integrity:
    name: "tests:integrity"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить контрольные суммы исходных тестов
        run: |
          printf '%s\n' \
            'acf588559c0bfa7abbaf3f11069fe7b82baa3853bc5957319e003b203a257326  tests/test_algorithm_properties.py' \
            '969c59adf54b69ab2b4fc6b98584757d6f90f2bb75539f5f4b21914771acb531  tests/test_algorithms.py' \
            '6ec13ba7d71c911b50abcab14497ada0c5386819e9a289de0720cdef87d18638  tests/test_checks.py' \
            'c16230abbdf1f5b379f74d62068668acc3c72c1d11828ad3613b3b8b47dd1942  tests/scripts/check_api.py' \
            '53c8566097ce80aaebc6d6299068388e71464788ef506529836f8cad6e21203d  tests/scripts/check_inference.py' \
            '667fc6546d73a0a3da9999e3e165d2f588ef8b307faab174f3c55ee677849669  tests/scripts/check_pr_history.py' \
            'b4da3908c5975d2f1796d7950eb3d7f4285f397bb42552951ad2844e608d94cf  tests/scripts/check_structure.py' \
            '1b026e612648d1d1c676972af94436bfa3ad27e11a73a0bd659f7c4e351a3d18  tests/scripts/check_ui.py' |
            sha256sum --check
      - name: Проверить неизменность выданного ui.py
        if: ${{ !cancelled() }}
        run: |
          echo '892c42f2c72c1306e7f44470bdcac0b6590084677482bacbf54b6a8606e2e48c  ui.py' | sha256sum --check || {
            echo 'ui.py изменён. По условию изменения допускаются только для бонусного задания; проверьте вручную.'
            exit 1
          }

  structure:
    name: "tests:structure"
    needs: test-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить название репозитория
        env:
          REPOSITORY: ${{ github.event.repository.name }}
        run: |
          if [ "$REPOSITORY" != "ensembles" ]; then
            echo "Ошибка: репозиторий должен называться ensembles, сейчас: $REPOSITORY"
            exit 1
          fi
          echo 'OK: репозиторий называется ensembles'
      - name: Проверить структуру репозитория
        if: ${{ !cancelled() }}
        run: python tests/scripts/check_structure.py

  pr-history:
    name: "tests:pr-history"
    needs: structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить скрипт проверки
        uses: actions/checkout@v4
      - name: Проверить коммиты main и описания PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/scripts/check_pr_history.py

  linters:
    name: "tests:linters"
    needs: pr-history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Hadolint
        run: docker run --rm -i hadolint/hadolint < Dockerfile
      - name: ShellCheck
        if: ${{ !cancelled() }}
        run: |
          git ls-files -z -- '*.sh' |
            xargs -0 -r docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable --
      - name: Установить зависимости
        if: ${{ !cancelled() }}
        run: python -m pip install -r requirements.txt flake8 pylint playwright
      - name: Flake8
        if: ${{ !cancelled() }}
        run: |
          git ls-files -z -- '*.py' ':!:tests/**' ':!:ui.py' |
            xargs -0 -r python -m flake8 --max-line-length=120 --
      - name: Pylint
        if: ${{ !cancelled() }}
        run: |
          git ls-files -z -- '*.py' ':!:tests/**' ':!:ui.py' |
            xargs -0 -r python -m pylint --max-line-length=120 --disable=C0103,C0114,C0115 --

  checks:
    name: "tests:algorithms"
    needs: linters
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Установить зависимости тестов
        run: python -m pip install -r requirements.txt

      - name: Запустить smoke-тесты алгоритмов
        run: python -m pytest -v

  docker-hub:
    name: "tests:docker-hub"
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Проверить доступность опубликованного образа
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: |
          # Docker Hub использует имя владельца GitHub в нижнем регистре.
          owner=$(printf '%s' "$GITHUB_OWNER" | tr '[:upper:]' '[:lower:]')
          image="docker.io/$owner/ensembles:latest"
          echo "Проверяется публичный образ: $image"
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          docker pull "$image"

  docker-ui:
    name: "tests:docker-and-ui"
    needs: docker-hub
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Собрать образы
        run: docker compose build
      - name: Запустить сервисы
        run: docker compose up -d --no-build
      - name: Проверить Python 3.11 внутри контейнеров
        run: |
          for service in backend frontend; do
            echo "Проверка Python в $service"
            docker compose exec -T "$service" python3 -c 'import sys; print(sys.version); assert sys.version_info[:2] == (3, 11), "Требуется Python 3.11"'
          done
      - name: Проверить расположение и аннотации ручек FastAPI
        run: docker compose exec -T backend python - < tests/scripts/check_api.py
      - name: Установить инструменты UI-теста
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Проверить API и интерфейс
        run: python tests/scripts/check_ui.py
      - name: Проверить количество и значения предсказаний
        run: docker compose exec -T frontend python - < tests/scripts/check_inference.py
      - name: Логи сервисов
        if: ${{ failure() }}
        run: docker compose logs --no-color
      - name: Остановить сервисы
        if: ${{ always() }}
        run: docker compose down --volumes
